<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; }

    .container { max-width: 800px; margin: auto; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }

    p { margin: 0; color: #8b949e; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; transition: border-color 0.2s; }
    .card:hover { border-color: var(--accent); }
    .card-title { font-weight: 600; color: #f0f6fc; font-size: 16px; }
    .badge { background: #238636; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
  </style>
