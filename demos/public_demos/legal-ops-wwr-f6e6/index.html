<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Ops Platform - Hex Technologies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: {
                            0: '#05070C',
                            1: '#0A0D12',
                            2: '#0F131C',
                            3: '#161D2B',
                            4: '#1E2636',
                            5: '#2A3344'
                        },
                        accent: {
                            primary: '#3B6DFF',
                            muted: '#5B7FC7'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --spacing-xs: clamp(0.5rem, 1vw, 0.75rem);
            --spacing-sm: clamp(0.75rem, 1.5vw, 1rem);
            --spacing-md: clamp(1rem, 2vw, 1.5rem);
            --spacing-lg: clamp(1.5rem, 3vw, 2.5rem);
            --spacing-xl: clamp(2rem, 4vw, 4rem);
            --text-xs: clamp(0.75rem, 1.2vw, 0.875rem);
            --text-sm: clamp(0.875rem, 1.4vw, 1rem);
            --text-base: clamp(1rem, 1.6vw, 1.125rem);
            --text-lg: clamp(1.125rem, 2vw, 1.5rem);
            --text-xl: clamp(1.5rem, 3vw, 2.25rem);
            --text-2xl: clamp(2rem, 4vw, 3.5rem);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 999px;
        }
        
        body {
            font-family: var(--font-sans);
            background: #05070C;
            color: #E5E7EB;
            line-height: 1.6;
        }
        
        .banner {
            background: linear-gradient(135deg, #3B6DFF 0%, #5B7FC7 100%);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .btn-primary {
            background: #3B6DFF;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-size: var(--text-sm);
        }
        
        .btn-primary:hover {
            background: #2D5AE5;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: #1E2636;
            color: #E5E7EB;
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius-full);
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid #2A3344;
            cursor: pointer;
            font-size: var(--text-sm);
        }
        
        .btn-secondary:hover {
            background: #2A3344;
            border-color: #3B6DFF;
        }
        
        .card {
            background: #0F131C;
            border: 1px solid #1E2636;
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            transition: all 0.2s;
        }
        
        .card:hover {
            border-color: #2A3344;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #0F131C 0%, #161D2B 100%);
            border: 1px solid #1E2636;
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
        }
        
        .badge-success {
            background: rgba(110, 231, 183, 0.1);
            color: #6EE7B7;
        }
        
        .badge-warning {
            background: rgba(251, 191, 36, 0.1);
            color: #FBBF24;
        }
        
        .badge-info {
            background: rgba(59, 109, 255, 0.1);
            color: #3B6DFF;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #161D2B;
            border-radius: var(--radius-full);
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3B6DFF 0%, #6EE7B7 100%);
            border-radius: var(--radius-full);
            transition: width 0.5s ease;
        }
        
        .metric-value {
            font-size: var(--text-2xl);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #3B6DFF 0%, #6EE7B7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .filter-chip {
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            background: #161D2B;
            border: 1px solid #1E2636;
            cursor: pointer;
            transition: all 0.2s;
            font-size: var(--text-sm);
        }
        
        .filter-chip:hover {
            border-color: #3B6DFF;
        }
        
        .filter-chip.active {
            background: #3B6DFF;
            border-color: #3B6DFF;
            color: white;
        }
        
        .search-input {
            background: #0F131C;
            border: 1px solid #1E2636;
            border-radius: var(--radius-full);
            padding: 0.75rem 1.25rem;
            color: #E5E7EB;
            width: 100%;
            font-size: var(--text-sm);
            transition: all 0.2s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #3B6DFF;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .table th {
            text-align: left;
            padding: 0.75rem;
            font-weight: 600;
            font-size: var(--text-xs);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9CA3AF;
            border-bottom: 1px solid #1E2636;
        }
        
        .table td {
            padding: 1rem 0.75rem;
            border-bottom: 1px solid #161D2B;
            font-size: var(--text-sm);
        }
        
        .table tr:hover {
            background: #0F131C;
        }
        
        .icon-well {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #161D2B;
        }
        
        .workflow-step {
            position: relative;
            padding-left: 3rem;
            padding-bottom: 2rem;
        }
        
        .workflow-step::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 48px;
            bottom: 0;
            width: 2px;
            background: #1E2636;
        }
        
        .workflow-step:last-child::before {
            display: none;
        }
        
        .workflow-step:last-child {
            padding-bottom: 0;
        }
        
        .workflow-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #3B6DFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <!-- Banner -->
    <div class="banner">

            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <span style="font-size: 1.25rem;">🚀</span>
                <span style="font-weight: 600; font-size: var(--text-sm);">Live Interactive Prototype for: Legal Ops | Built autonomously by Antigravity OS | Ready for deployment</span>
            </div>
            <a href="mailto:lamvukyo3001@gmail.com?subject=Hire%20Antigravity%20Team%20for%20wwr-f6e6e94a" class="btn-primary" style="text-decoration: none;">
                Hire Team ($150 - $500)
            </a>
        </div>
    </div>

    <!-- Main Container -->
    <div style="max-width: 1400px; margin: 0 auto; padding: var(--spacing-lg) 1.5rem;">
        
        <!-- Header -->
        <header style="margin-bottom: var(--spacing-xl);">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem;">
                <div>

                    <p style="color: #9CA3AF; font-size: var(--text-base);">AI-powered contract lifecycle management & workflow automation</p>
                </div>

                </div>
            </div>
        </header>

        <!-- KPI Stats Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--spacing-md); margin-bottom: var(--spacing-xl);">
            <div class="stat-card">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                    <span style="color: #9CA3AF; font-size: var(--text-sm); font-weight: 500;">Active Contracts</span>
                    <div class="icon-well" style="width: 40px; height: 40px;">
                        <svg width="20" height="20" fill
