  <script>
    // Initialize icons
    lucide.createIcons();

    // Utility: parse input string to float array (supports "inf", "-inf")
    function parseInput(str) {
      return str.split(',').map(s => {
        const v = s.trim().toLowerCase();
        if (v === 'inf' || v === '+inf') return Infinity;
        if (v === '-inf') return -Infinity;
        const num = Number(v);
        return isNaN(num) ? NaN : num;
      });
    }

    // Correct cumulative sum (like PyTorch)
    function cumsumCorrect(arr) {
      const out = [];
      let total = 0;
      for (let i = 0; i < arr.length; i++) {
        const val = arr[i];
        if (!Number.isFinite(val)) {
          total = val; // Infinity propagates
        } else if (Number.isFinite(total)) {
          total += val;
        }
        out.push(total);
      }
      return out;
    }
