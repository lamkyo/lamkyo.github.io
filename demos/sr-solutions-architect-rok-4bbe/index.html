<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<title>ExtraHop Solutions Architect Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { background-color: #0f172a; color: #e2e8f0; }
  .progress-bar { transition: width 0.3s ease; }
</style>
</head>
<body class="font-sans antialiased">

<!-- Sticky Header -->
<div class="fixed inset-x-0 top-0 bg-gray-900 text-white py-2 px-4 flex items-center justify-between z-50">
  <div class="flex items-center space-x-2">
    <svg data-lucide="rocket" class="h-5 w-5"></svg>
    <span>🚀 Live Interactive Prototype for: Sr Solutions Architect | Built autonomously by Antigravity OS | Ready for deployment</span>
  </div>
  <a href="mailto:lamvukyo3001@gmail.com?subject=Hire%20Antigravity%20Team%20for%20rok-4bbeba82"
     class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1 rounded-md flex items-center space-x-1">
    <svg data-lucide="briefcase" class="h-4 w-4"></svg>
    <span>Hire Team ($150 - $500)</span>
  </a>
</div>

<!-- Main Content -->
<div class="pt-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
  <!-- Section 1: Trigger Script Editor -->
  <section class="bg-gray-800 rounded-lg shadow p-6">
    <h2 class="text-xl font-semibold mb-4 flex items-center space-x-2">
      <svg data-lucide="code" class="h-6 w-6"></svg>
      <span>Trigger Script Editor</span>
    </h2>
    <textarea id="script-editor" class="w-full h-32 bg-gray-900 text-green-400 rounded p-2 mb-4 resize-none" placeholder="// Write your JavaScript trigger script here"></textarea>
    <button id="run-script" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
      <svg data-lucide="play" class="h-4 w-4"></svg>
      <span>Run Script</span>
    </button>
    <div id="script-output" class="mt-4 hidden">
      <div class="bg-gray-900 rounded p-2 text-sm">
        <span id="script-log"></span>
      </div>
    </div>
    <div id="progress-container" class="mt-4 hidden">
      <div class="w-full bg-gray-700 rounded h-2 overflow-hidden">
        <div id="progress-bar" class="progress-bar bg-indigo-600 h-2 w-0"></div>
      </div>
    </div>
  </section>

  <!-- Section 2: API Integration -->
  <section class="bg-gray-800 rounded-lg shadow p-6">
    <h2 class="text-xl font-semibold mb-4 flex items-center space-x-2">
      <svg data-lucide="api" class="h-6 w-6"></svg>
      <span>API Integration</span>
    </h2>
    <div class="flex items-center space-x-4 mb-4">
      <input id="api-search" type="text" placeholder="Search flows..." class="bg-gray-900 text-white rounded px-3 py-1 w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button id="fetch-data" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
        <svg data-lucide="download" class="h-4 w-4"></svg>
        <span>Fetch Sample Data</span>
      </button>
    </div>
    <div class="overflow-x-auto">
      <table id="api-table" class="min-w-full bg-gray-900 rounded">
        <thead>
          <tr>
            <th class="px-4 py-2 text-left text-sm font-medium">Flow ID</th>
            <th class="px-4 py-2 text-left text-sm font-medium">Source</th
